[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glmdisc"
dynamic = ["version"]
description = "Feature quantization for parsimonious and interpretable models"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Adrien Ehrhardt", email = "adrien.ehrhardt@centraliens-lille.org"}]
keywords = ["discretization", "logistic regression", "levels grouping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "loguru",
    "matplotlib>=3.7",
    "numpy>=1.26",
    "pandas>=2.0",
    "pygam>=0.9.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "tensorflow>=2.16",
]

[project.optional-dependencies]
test = ["coverage", "flake8", "pytest"]
docs = ["numpydoc", "sphinx", "sphinx-rtd-theme"]

[project.urls]
Homepage = "https://adimajo.github.io/glmdisc_python"
Source = "https://github.com/adimajo/glmdisc_python"
Issues = "https://github.com/adimajo/glmdisc_python/issues"

[tool.setuptools.dynamic]
version = {attr = "glmdisc.__version__"}

[tool.setuptools.packages.find]
include = ["glmdisc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# NumPy will turn this deprecation into an error
filterwarnings = ["error:Conversion of an array with ndim:DeprecationWarning"]
